name: PlatformIO CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check wire-format v4 conformance vectors
        run: |
          python3 scripts/gen_vectors_v4.py --check
          python3 scripts/gen_vectors_v4.py --emit-c /tmp/v4_vectors_generated.h
          diff -u test/v4_vectors_generated.h /tmp/v4_vectors_generated.h

      - name: Install AVR toolchain (and build the AVR demo)
        run: pio run -e arduino_uno

      - name: Check v4 memory footprint
        run: |
          python3 scripts/measure_v4.py --budget --toolchains avr,host
          python3 scripts/measure_v4.py --check-readme --toolchains avr,host

      - name: Build and run the v4 examples
        run: sh scripts/check_examples.sh

      - name: Robustness (property fuzzer + noise channel)
        run: sh scripts/check_robustness.sh

      - name: Install lcov
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov

      - name: Run tests with coverage
        run: platformio test -e test -v

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          # Collect coverage from .pio/build/test into lcov format
          lcov --capture --directory .pio/build/test \
               --output-file coverage/lcov.info \
               --ignore-errors inconsistent
          # Exclude Unity framework and system headers
          lcov --remove coverage/lcov.info \
               '*/libdeps/*' '*/Unity/*' '*/unity/*' \
               --output-file coverage/lcov.info \
               --ignore-errors inconsistent,unused

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
